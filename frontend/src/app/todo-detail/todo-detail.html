@if (todo(); as t) {
  <mat-card>
    <mat-card-header>
      <mat-card-title>{{ t.title }}</mat-card-title>
      <mat-card-subtitle>Status: {{ t.done ? 'done' : 'open' }}</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <p>{{ t.description }}</p>
    </mat-card-content>
    <mat-card-actions>
      <a matButton [routerLink]="['/todos', t.id, 'edit']"><mat-icon>edit</mat-icon>Edit</a>
      <button matButton type="button" (click)="remove()"><mat-icon>delete</mat-icon>Delete</button>
      <a matButton routerLink="/todos">Back</a>
    </mat-card-actions>
  </mat-card>
}
